<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Manish Steel Traders logo (placeholder)">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6aa3"/>
      <stop offset="1" stop-color="#163a5c"/>
    </linearGradient>
  </defs>
  <!-- bolt-head / hex badge -->
  <path d="M32 2 56 16 56 48 32 62 8 48 8 16Z" fill="url(#steel)"/>
  <path d="M32 2 56 16 56 48 32 62 8 48 8 16Z" fill="none" stroke="#0f2c47" stroke-width="1.5"/>
  <!-- I-beam mark in ember -->
  <g fill="#e8622c">
    <rect x="19" y="17" width="26" height="6" rx="1"/>
    <rect x="19" y="41" width="26" height="6" rx="1"/>
    <rect x="28.5" y="21" width="7" height="22"/>
  </g>
  <!-- MST monogram baseline tick -->
  <rect x="19" y="50" width="26" height="2.5" rx="1.25" fill="#ffffff" opacity=".85"/>
